# Render Blueprint: Zielkonfiguration für beide Dienste (ADR 0018).
# Produktion läuft bei Render. Bis diese Datei mit dem Dashboard abgeglichen ist, gilt bei
# Abweichungen das Dashboard; danach ist diese Datei die verbindliche Deployment-Quelle.
#
# Auto-Deploy soll aus sein: ausgeliefert wird nur ein freigegebener Commit. Ob ein bestehender
# Dienst so eingestellt ist, zeigt nur das Dashboard.
#
# `sync: false` heißt: Der Wert steht nicht in dieser Datei. Render fragt ihn bei der ersten
# Blueprint-Einrichtung ab und ignoriert den Eintrag bei späteren Aktualisierungen und in
# Previews. Das ist kein Secret Sync. Die Werte sollen per Infisical Secret Sync (Stage prod)
# zum Dienst kommen; diese Integration wird in Infisical eingerichtet und ist noch offen.

# Der Dienstname der Site ist noch nicht gegen das Dashboard geprüft; der des Portals stammt
# aus dem DNS-Eintrag von portal.uguroezdamar.com.

services:
  - type: web
    name: uguroezdamar-com
    runtime: node
    autoDeployTrigger: "off"
    buildCommand: corepack enable && pnpm install --frozen-lockfile && pnpm run build:site
    startCommand: pnpm --filter @ugur/site start
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: "24.21.0"
      - key: DATABASE_URL
        sync: false
      - key: NEXT_PUBLIC_SITE_URL
        sync: false
      - key: CONTACT_RATE_LIMIT_SECRET
        sync: false
      - key: REVALIDATE_SECRET
        sync: false

  - type: web
    name: portal-uguroezdamar-com
    runtime: node
    autoDeployTrigger: "off"
    buildCommand: corepack enable && pnpm install --frozen-lockfile && pnpm exec turbo run build --filter=@ugur/portal
    startCommand: pnpm --filter @ugur/portal start
    healthCheckPath: /login
    envVars:
      - key: NODE_VERSION
        value: "24.21.0"
      - key: DATABASE_URL
        sync: false
      - key: APP_URL
        sync: false
      - key: SITE_URL
        sync: false
      - key: ADMIN_API_KEY
        sync: false
