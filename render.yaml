# Render Blueprint – server-rendered Next.js site (@ugur/site).
# Netlify remains the canonical production deployment; use this only as an
# explicitly configured alternative with its own MONGODB_URI and domain.

services:
  - type: web
    name: ugur-site
    runtime: node
    buildCommand: corepack enable && pnpm install --frozen-lockfile && pnpm run build:site
    startCommand: pnpm --filter @ugur/site start
    envVars:
      - key: NODE_VERSION
        value: "24.21.0"
      - key: MONGODB_URI
        sync: false
      - key: NEXT_PUBLIC_SITE_URL
        sync: false
