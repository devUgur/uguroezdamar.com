# Render Blueprint for the preview only: two new web services that follow the `dev` branch and
# use the `dev` stage (Neon branch `dev`, Infisical environment `dev`). Step by step:
# docs/operations/preview.md
#
# Create it in Render as a Blueprint with this file as its path. It defines no production
# service, so syncing it cannot touch uguroezdamar.com or portal.uguroezdamar.com.
#
# `sync: false` means the value is not in this file: Render asks for it once, when the Blueprint
# is created, and ignores the entry afterwards. Keep the values in step with Infisical `dev`,
# by a Secret Sync or by hand.

services:
  - type: web
    name: uguroezdamar-preview
    runtime: node
    plan: free
    region: frankfurt
    branch: dev
    # A preview shows what is on `dev`; it deploys once the checks on that commit have passed.
    autoDeployTrigger: checksPass
    buildCommand: corepack enable && pnpm install --frozen-lockfile && pnpm run build:site
    startCommand: pnpm --filter @ugur/site exec next start -p $PORT
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "24.21.0"
      - key: DATABASE_URL
        sync: false
      - key: NEXT_PUBLIC_SITE_URL
        sync: false
      - key: CONTACT_RATE_LIMIT_SECRET
        sync: false

  - type: web
    name: uguroezdamar-portal-preview
    runtime: node
    plan: free
    region: frankfurt
    branch: dev
    autoDeployTrigger: checksPass
    buildCommand: corepack enable && pnpm install --frozen-lockfile && pnpm exec turbo run build --filter=@ugur/portal
    startCommand: pnpm --filter @ugur/portal exec next start -p $PORT
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "24.21.0"
      - key: DATABASE_URL
        sync: false
      - key: APP_URL
        sync: false
      - key: SITE_URL
        sync: false
      - key: ADMIN_API_KEY
        sync: false
