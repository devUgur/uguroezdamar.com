[build]
  # Public-site Netlify project: keep Base directory unset (repository root)
  # and set Package directory to apps/site in the Netlify UI.
  command = "pnpm --filter @ugur/site build"
  publish = "apps/site/.next"

[build.environment]
  NODE_VERSION = "24.21.0"
  PNPM_VERSION = "10.34.2"
  NEXT_USE_NETLIFY_EDGE = "true"
  NETLIFY_NEXT_SKEW_PROTECTION = "true"

[[plugins]]
  package = "@netlify/plugin-nextjs"

[[headers]]
  for = "/_next/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
