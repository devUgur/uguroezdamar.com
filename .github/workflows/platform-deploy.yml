name: Platform deploy

# Deploys apps/platform to Cloudflare Workers (ADR 0024). Runs only after a merge to main,
# i.e. after the owner approved the pull request, or when started by hand.
on:
  push:
    branches: [main]
    paths:
      - "apps/platform/**"
      - ".github/workflows/platform-deploy.yml"
  workflow_dispatch:

concurrency:
  group: platform-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Add a required reviewer to this environment in the repository settings to gate every deploy.
    environment: platform-production
    steps:
      - uses: actions/checkout@v5
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24.21.0
          package-manager-cache: false
      - name: Enable corepack
        run: corepack enable
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --filter @ugur/platform...
      - name: Typecheck
        run: pnpm --filter @ugur/platform typecheck
      # Plain wrangler instead of wrangler-action: the action uploads secrets before `deploy`,
      # which fails while the Worker does not exist yet. --secrets-file ships code and secrets
      # as one version. The file lives in RUNNER_TEMP and is never printed.
      - name: Apply D1 migrations
        working-directory: apps/platform
        run: pnpm exec wrangler d1 migrations apply uguroezdamar --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Deploy with secrets
        working-directory: apps/platform
        run: |
          secrets_file="$RUNNER_TEMP/platform-secrets.json"
          trap 'rm -f "$secrets_file"' EXIT
          node -e '
            const names = ["PLATFORM_ADMIN_TOKEN", "GEMINI_API_KEY", "AGENT_GITHUB_TOKEN"];
            const missing = names.filter((name) => !process.env[name]);
            if (missing.length) { console.error("Missing repository secrets: " + missing.join(", ")); process.exit(1); }
            require("fs").writeFileSync(process.argv[1], JSON.stringify(Object.fromEntries(names.map((n) => [n, process.env[n]]))), { mode: 0o600 });
          ' "$secrets_file"
          pnpm exec wrangler deploy --secrets-file "$secrets_file"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PLATFORM_ADMIN_TOKEN: ${{ secrets.PLATFORM_ADMIN_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          AGENT_GITHUB_TOKEN: ${{ secrets.AGENT_GITHUB_TOKEN }}
      - name: Smoke
        run: |
          for i in 1 2 3 4 5 6; do
            if curl -fsS https://platform.uguroezdamar.com/api/health; then exit 0; fi
            sleep 10
          done
          echo "platform.uguroezdamar.com/api/health is not answering" >&2
          exit 1
