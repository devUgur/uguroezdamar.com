name: Platform deploy

# Deploys apps/platform to Cloudflare Workers (ADR 0024).
#   branch dev  -> uguroezdamar-platform-dev, platform-dev.uguroezdamar.com (wrangler env "dev")
#   branch main -> uguroezdamar-platform, platform.uguroezdamar.com (production; main changes only by PR)
on:
  push:
    branches: [main, dev]
    paths:
      - "apps/platform/**"
      - ".github/workflows/platform-deploy.yml"
  workflow_dispatch:

concurrency:
  group: platform-deploy-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Add a required reviewer to platform-production in the repository settings to gate production.
    environment: ${{ github.ref_name == 'main' && 'platform-production' || 'platform-dev' }}
    env:
      WRANGLER_ENV_FLAG: ${{ github.ref_name != 'main' && '--env dev' || '' }}
      PLATFORM_URL: ${{ github.ref_name == 'main' && 'https://platform.uguroezdamar.com' || 'https://platform-dev.uguroezdamar.com' }}
    steps:
      - uses: actions/checkout@v5
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24.21.0
          package-manager-cache: false
      - name: Enable corepack
        run: corepack enable
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --filter @ugur/platform...
      - name: Typecheck
        run: pnpm --filter @ugur/platform typecheck
      # Plain wrangler instead of wrangler-action: the action uploads secrets before `deploy`,
      # which fails while the Worker does not exist yet. --secrets-file ships code and secrets
      # as one version. The file lives in RUNNER_TEMP and is never printed.
      # Cloudflare refuses any Worker upload (code 10063) until the account has a workers.dev
      # subdomain, even though this Worker serves only its custom domains. Create it once if missing.
      - name: Ensure account workers.dev subdomain
        run: |
          api="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/subdomain"
          auth="Authorization: Bearer $CLOUDFLARE_API_TOKEN"
          if curl -fsS -H "$auth" "$api" | grep -q '"subdomain":"[^"]'; then echo "subdomain exists"; exit 0; fi
          for name in uguroezdamar uguroezdamar-platform; do
            if curl -fsS -X PUT -H "$auth" -H "content-type: application/json" --data "{\"subdomain\":\"$name\"}" "$api" >/dev/null; then
              echo "created $name.workers.dev"; exit 0
            fi
          done
          echo "::error::Could not create a workers.dev subdomain; open Workers & Pages once in the dashboard of this account."
          exit 1
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Apply D1 migrations
        working-directory: apps/platform
        run: pnpm exec wrangler d1 migrations apply DB --remote $WRANGLER_ENV_FLAG
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Deploy with secrets
        working-directory: apps/platform
        run: |
          secrets_file="$RUNNER_TEMP/platform-secrets.json"
          trap 'rm -f "$secrets_file"' EXIT
          # Only the Cloudflare secrets are required. The others are uploaded when set; a missing
          # one keeps its previous Worker value (secrets files are additive):
          #   PLATFORM_ADMIN_TOKEN  login until Cloudflare Access is in front; without it nobody gets in
          #   GEMINI_API_KEY        optional; without it the router falls back to Workers AI
          #   AGENT_GITHUB_TOKEN    optional; without it the repo tools report a missing token
          node -e '
            const names = ["PLATFORM_ADMIN_TOKEN", "GEMINI_API_KEY", "AGENT_GITHUB_TOKEN"];
            const set = names.filter((name) => process.env[name]);
            const missing = names.filter((name) => !process.env[name]);
            if (missing.length) console.log("::warning::Not set, skipped: " + missing.join(", "));
            require("fs").writeFileSync(process.argv[1], JSON.stringify(Object.fromEntries(set.map((n) => [n, process.env[n]]))), { mode: 0o600 });
          ' "$secrets_file"
          pnpm exec wrangler deploy --secrets-file "$secrets_file" $WRANGLER_ENV_FLAG
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PLATFORM_ADMIN_TOKEN: ${{ secrets.PLATFORM_ADMIN_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          AGENT_GITHUB_TOKEN: ${{ secrets.AGENT_GITHUB_TOKEN }}
      - name: Smoke
        run: |
          for i in 1 2 3 4 5 6; do
            if curl -fsS "$PLATFORM_URL/api/health"; then exit 0; fi
            sleep 10
          done
          echo "$PLATFORM_URL/api/health is not answering" >&2
          exit 1
