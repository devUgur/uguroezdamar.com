name: CI

on:
  push:
    # `dev` is what the preview deploys once these checks have passed.
    branches: [ main, dev ]
  # Every pull request, also one stacked on another branch.
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24.21.0
          package-manager-cache: false
      - name: Enable corepack
        run: corepack enable
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm lint
      - name: Migrations match the schema
        run: pnpm db:check
      - name: Typecheck
        run: pnpm typecheck
      - name: Tests
        run: pnpm test
      - name: Build
        run: pnpm build
