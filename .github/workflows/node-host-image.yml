name: Node host image

# Builds the agent API as a Node host image (ADR 0045, R5) and publishes it to the GitHub Container Registry. Every host
# runs this same image: Northflank, Railway, Docker. No host builds it itself, so no host-specific build exists.
#   branch dev -> ghcr.io/<owner>/uguroezdamar-api:dev and :dev-<sha>
# It deploys nothing; which host pulls which tag is decided per host (docs/architecture/r5-cloud-host.md).
on:
  push:
    branches: [dev]
    paths:
      - "apps/api/**"
      - "apps/node-host/**"
      - "deployments/docker/**"
      - "packages/core/**"
      - "pnpm-lock.yaml"
      - "package.json"
      - ".github/workflows/node-host-image.yml"
  workflow_dispatch:

concurrency:
  group: node-host-image-${{ github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Image name
        id: name
        # Registry names must be lower case; the repository owner may not be.
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/uguroezdamar-api" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deployments/docker/Dockerfile
          target: api
          push: true
          tags: |
            ${{ steps.name.outputs.image }}:${{ github.ref_name }}
            ${{ steps.name.outputs.image }}:${{ github.ref_name }}-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke-start the image
        # The image must start with a valid cloud configuration and answer its health check; data stays in the job.
        run: |
          docker network create smoke
          docker run -d --name pg --network smoke -e POSTGRES_HOST_AUTH_METHOD=trust -e POSTGRES_DB=agents postgres:17
          for i in $(seq 1 30); do docker exec pg pg_isready -U postgres && break; sleep 1; done
          docker run -d --name api --network smoke -p 3103:3103 \
            -e NODE_HOST_DATABASE_URL=postgres://postgres@pg:5432/agents \
            -e API_SERVICE_TOKEN="$(openssl rand -hex 24)" -e PROVIDER_KEYS_SECRET="$(openssl rand -hex 32)" \
            "${{ steps.name.outputs.image }}:${{ github.ref_name }}-${{ github.sha }}"
          for i in $(seq 1 30); do curl -fsS http://localhost:3103/api/health && exit 0; sleep 2; done
          docker logs api
          exit 1
