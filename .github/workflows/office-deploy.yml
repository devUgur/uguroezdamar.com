name: Office deploy

# Deploys apps/office, the office app (Next.js via OpenNext), to Cloudflare Workers (ADR 0039).
#   branch dev  -> uguroezdamar-office-dev, office-dev.uguroezdamar.com (wrangler env "dev")
#   branch main -> uguroezdamar-office, office.uguroezdamar.com (production; main changes only by PR)
# The custom domains create their DNS records and certificates on deploy. The office uses the service
# token of its stage, which lives in the API's GitHub environments (api-dev, api-production); it needs no secret of its own.
on:
  push:
    branches: [main, dev]
    paths:
      - "apps/office/**"
      - "packages/ui/**"
      - "packages/core/**"
      - "pnpm-lock.yaml"
      - ".github/workflows/office-deploy.yml"
  workflow_dispatch:

concurrency:
  group: office-deploy-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name == 'main' && 'api-production' || 'api-dev' }}
    env:
      WRANGLER_ENV_FLAG: ${{ github.ref_name != 'main' && '--env dev' || '' }}
      OFFICE_URL: ${{ github.ref_name == 'main' && 'https://office.uguroezdamar.com' || 'https://office-dev.uguroezdamar.com' }}
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v5
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24.21.0
          package-manager-cache: false
      - name: Enable corepack
        run: corepack enable
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --filter @ugur/office...
      - name: Typecheck
        run: pnpm --filter @ugur/office typecheck
      - name: Build worker
        working-directory: apps/office
        run: pnpm exec opennextjs-cloudflare build
      # Workers Free allows 3 MiB compressed. The dry run prints the size; a larger bundle needs Workers Paid.
      - name: Bundle size
        working-directory: apps/office
        run: pnpm exec wrangler deploy --dry-run $WRANGLER_ENV_FLAG | tee "$RUNNER_TEMP/dry-run.txt" | grep -i "upload" || true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Deploy with secrets
        working-directory: apps/office
        run: |
          secrets_file="$RUNNER_TEMP/office-secrets.json"
          trap 'rm -f "$secrets_file"' EXIT
          # API_SERVICE_TOKEN: the office server's key to the API and the key its sessions are signed with.
          node -e '
            if (!process.env.API_SERVICE_TOKEN) { console.log("::error::API_SERVICE_TOKEN is not set in this environment"); process.exit(1); }
            require("fs").writeFileSync(process.argv[1], JSON.stringify({ API_SERVICE_TOKEN: process.env.API_SERVICE_TOKEN }), { mode: 0o600 });
          ' "$secrets_file"
          pnpm exec wrangler deploy --secrets-file "$secrets_file" $WRANGLER_ENV_FLAG
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          API_SERVICE_TOKEN: ${{ secrets.API_SERVICE_TOKEN }}
      # Without a session the office sends the browser to the portal sign-in; that redirect proves the Worker answers.
      - name: Smoke
        run: |
          for i in 1 2 3 4 5 6 7 8 9; do
            location=$(curl -sS -o /dev/null -w '%{http_code} %{redirect_url}' "$OFFICE_URL/" || true)
            echo "attempt $i: $location"
            case "$location" in
              30*"/office-handoff"*) echo "office answers and sends to the portal sign-in"; exit 0 ;;
            esac
            sleep 10
          done
          echo "$OFFICE_URL did not answer with the sign-in redirect" >&2
          exit 1
