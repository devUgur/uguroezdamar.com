name: API deploy

# Deploys apps/api, the agent backend of the portal, to Cloudflare Workers (ADR 0024).
#   branch dev  -> uguroezdamar-api-dev, api-dev.uguroezdamar.com (wrangler env "dev", GitHub environment api-dev)
#   branch main -> uguroezdamar-api, api.uguroezdamar.com (production; main changes only by PR)
# API_SERVICE_TOKEN is an environment secret (one value per environment, shared with the portal
# through Infisical); `pnpm ugur api secrets --apply` sets both sides.
on:
  push:
    branches: [main, dev]
    paths:
      - "apps/api/**"
      - ".github/workflows/api-deploy.yml"
  workflow_dispatch:

concurrency:
  group: api-deploy-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Add a required reviewer to api-production in the repository settings to gate production.
    environment: ${{ github.ref_name == 'main' && 'api-production' || 'api-dev' }}
    env:
      WRANGLER_ENV_FLAG: ${{ github.ref_name != 'main' && '--env dev' || '' }}
      API_URL: ${{ github.ref_name == 'main' && 'https://api.uguroezdamar.com' || 'https://api-dev.uguroezdamar.com' }}
    steps:
      - uses: actions/checkout@v5
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24.21.0
          package-manager-cache: false
      - name: Enable corepack
        run: corepack enable
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --filter @ugur/api...
      - name: Typecheck
        run: pnpm --filter @ugur/api typecheck
      # Plain wrangler instead of wrangler-action: the action uploads secrets before `deploy`,
      # which fails while the Worker does not exist yet. --secrets-file ships code and secrets
      # as one version. The file lives in RUNNER_TEMP and is never printed.
      # Cloudflare refuses any Worker upload (code 10063) until the account has a workers.dev
      # subdomain, even though this Worker serves only its custom domains. Create it once if missing.
      - name: Ensure account workers.dev subdomain
        run: |
          api="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/subdomain"
          auth="Authorization: Bearer $CLOUDFLARE_API_TOKEN"
          for name in uguroezdamar uguroezdamar-api; do
            # 200: created; 409: the account already has one (or the name is taken) — check below.
            code=$(curl -s -o /dev/null -w '%{http_code}' -X PUT -H "$auth" -H "content-type: application/json" --data "{\"subdomain\":\"$name\"}" "$api")
            echo "PUT $name: $code"
            if [ "$code" = 200 ]; then exit 0; fi
          done
          if curl -fsS -H "$auth" "$api" | grep -Eq '"subdomain" *: *"[^"]+"'; then echo "subdomain exists"; exit 0; fi
          echo "::error::Could not create a workers.dev subdomain; open Workers & Pages once in the dashboard of this account."
          exit 1
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Apply D1 migrations
        working-directory: apps/api
        run: pnpm exec wrangler d1 migrations apply DB --remote $WRANGLER_ENV_FLAG
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Deploy with secrets
        working-directory: apps/api
        run: |
          secrets_file="$RUNNER_TEMP/api-secrets.json"
          trap 'rm -f "$secrets_file"' EXIT
          # Only the Cloudflare secrets are required. The others are uploaded when set; a missing
          # one keeps its previous Worker value (secrets files are additive):
          #   API_SERVICE_TOKEN     the portal's key to this API; without it every call gets 401
          #   GEMINI_API_KEY        optional; without it the router falls back to Workers AI
          #   AGENT_GITHUB_TOKEN    optional; without it the repo tools report a missing token
          #   AGENT_GH_APP_ID / AGENT_GH_APP_PRIVATE_KEY  optional; GitHub App (ADR 0031), replaces the token where installed
          #   MODAL_LLM_API_KEY     optional; key of the own models on Modal (apps/api/modal/llm.py)
          node -e '
            const names = ["API_SERVICE_TOKEN", "GEMINI_API_KEY", "AGENT_GITHUB_TOKEN", "AGENT_GH_APP_ID", "AGENT_GH_APP_PRIVATE_KEY", "MODAL_LLM_API_KEY"];
            const set = names.filter((name) => process.env[name]);
            const missing = names.filter((name) => !process.env[name]);
            if (missing.length) console.log("::warning::Not set, skipped: " + missing.join(", "));
            require("fs").writeFileSync(process.argv[1], JSON.stringify(Object.fromEntries(set.map((n) => [n, process.env[n]]))), { mode: 0o600 });
          ' "$secrets_file"
          pnpm exec wrangler deploy --secrets-file "$secrets_file" $WRANGLER_ENV_FLAG
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          API_SERVICE_TOKEN: ${{ secrets.API_SERVICE_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          AGENT_GITHUB_TOKEN: ${{ secrets.AGENT_GITHUB_TOKEN }}
          AGENT_GH_APP_ID: ${{ secrets.AGENT_GH_APP_ID }}
          AGENT_GH_APP_PRIVATE_KEY: ${{ secrets.AGENT_GH_APP_PRIVATE_KEY }}
          MODAL_LLM_API_KEY: ${{ secrets.MODAL_LLM_API_KEY }}
      # Workers and custom domains that no longer exist in wrangler.jsonc (the former "platform"
      # worker, ADR 0024). Only these exact names; anything already gone is fine.
      - name: Remove retired Workers
        run: |
          api="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers"
          auth="Authorization: Bearer $CLOUDFLARE_API_TOKEN"
          for host in platform-dev.uguroezdamar.com platform.uguroezdamar.com; do
            for id in $(curl -fsS -H "$auth" "$api/domains?hostname=$host" | jq -r '.result[].id'); do
              curl -fsS -X DELETE -H "$auth" "$api/domains/$id" >/dev/null && echo "removed domain $host"
            done
          done
          for name in uguroezdamar-platform-dev uguroezdamar-platform; do
            code=$(curl -s -o /tmp/delete.json -w '%{http_code}' -X DELETE -H "$auth" "$api/scripts/$name?force=true")
            case "$code" in
              200) echo "deleted $name" ;;
              404) echo "$name already gone" ;;
              *) echo "::error::deleting $name failed ($code)"; jq -c '.errors' /tmp/delete.json; exit 1 ;;
            esac
          done
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Smoke
        run: |
          snapshot_file="$RUNNER_TEMP/office-snapshot.json"
          trap 'rm -f "$snapshot_file"' EXIT
          for i in 1 2 3 4 5 6; do
            if curl -fsS "$API_URL/api/health" >/dev/null; then break; fi
            sleep 10
          done
          curl -fsS "$API_URL/api/health" >/dev/null || { echo "$API_URL/api/health is not answering" >&2; exit 1; }
          for i in 1 2 3 4 5 6; do
            if status=$(curl -sS -o "$snapshot_file" -w '%{http_code}' \
              -H "Authorization: Bearer $API_SERVICE_TOKEN" \
              -H "x-portal-actor: api-deploy-smoke" \
              "$API_URL/api/office/state"); then
              if [ "$status" = 200 ] && node -e '
              const state = JSON.parse(require("fs").readFileSync(process.argv[1], "utf8"));
              if (!Number.isInteger(state.revision) || !state.bounds || !Array.isArray(state.placements) || !state.agents) process.exit(1);
              ' "$snapshot_file"; then
                echo "API health and authenticated office snapshot passed"
                exit 0
              fi
            fi
            sleep 10
          done
          echo "$API_URL/api/office/state did not return a valid authenticated snapshot" >&2
          exit 1
        env:
          API_SERVICE_TOKEN: ${{ secrets.API_SERVICE_TOKEN }}
