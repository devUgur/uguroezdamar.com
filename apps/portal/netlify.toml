[build]
  # Portal Netlify project: keep Base directory unset (repository root)
  # and set Package directory to apps/portal in the Netlify UI. This lets
  # Netlify install the pnpm workspace from its root.
  command = "pnpm --filter @ugur/portal build"
  publish = "apps/portal/.next"

[build.environment]
  NODE_VERSION = "24.21.0"
  PNPM_VERSION = "10.34.2"
  NETLIFY_NEXT_SKEW_PROTECTION = "true"

[[headers]]
  for = "/_next/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
